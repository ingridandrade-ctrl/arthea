# Dispara processamento de fluxos de automação a cada 5 minutos.
# Substitui o Vercel Cron (que exige plano Pro pra rodar com frequência <1d).
#
# Configuração necessária no GitHub (uma vez):
#   Settings → Secrets and variables → Actions
#     - Secret CRON_SECRET   = mesmo valor configurado na Vercel
#     - Variable PROD_URL    = https://seu-dominio.com (sem barra no final)
#
# Atenção: o agendador do GitHub Actions pode atrasar em até 5–10 min em
# horários de pico. Pra timing exato, use Vercel Pro ou Upstash QStash.

name: cron · flows
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:  # permite disparar manualmente pela UI do GitHub

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/cron/flows
        run: |
          set -e
          if [ -z "${{ vars.PROD_URL }}" ]; then
            echo "::error::Variable PROD_URL não configurada (Settings → Variables → Actions)"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PROD_URL }}/api/cron/flows"
